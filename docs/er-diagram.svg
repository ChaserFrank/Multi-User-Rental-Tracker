<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
  <title id="title">Multi-User Rental Tracker Entity Relationship Diagram</title>
  <desc id="desc">Four-table SQLite schema showing users, listed_items, rentals, application_logs, and their foreign-key relationships.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9bb0"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .canvas { fill: #0e1116; }
      .entity { fill: #1b212b; stroke: #394757; stroke-width: 1.5; }
      .header { fill: #222c3a; }
      .row-alt { fill: #1e2530; }
      .table-name { fill: #f1f5f9; font: 600 17px ui-sans-serif, system-ui, sans-serif; }
      .field { fill: #d5dce5; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .type { fill: #8795a6; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .marker-pk { fill: #f5c451; font: 700 10px ui-sans-serif, system-ui, sans-serif; }
      .marker-fk { fill: #62b0ff; font: 700 10px ui-sans-serif, system-ui, sans-serif; }
      .marker-null { fill: #aeb9c7; font: 700 10px ui-sans-serif, system-ui, sans-serif; }
      .constraint { fill: #aeb9c7; font: 11px ui-sans-serif, system-ui, sans-serif; }
      .relation { fill: none; stroke: #8b9bb0; stroke-width: 1.8; marker-end: url(#arrow); }
      .relation-label { fill: #c2cedb; font: 11px ui-sans-serif, system-ui, sans-serif; paint-order: stroke; stroke: #0e1116; stroke-width: 4px; stroke-linejoin: round; }
      .legend-title { fill: #f1f5f9; font: 600 13px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #aeb9c7; font: 12px ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1320" height="820"/>

  <!-- Relationships are drawn behind the entity cards. -->
  <!-- users.id -> listed_items.owner_id -->
  <path class="relation" d="M 286 188 C 390 188, 420 164, 520 164"/>
  <text class="relation-label" x="360" y="151">1 : N  owns</text>

  <!-- users.id -> rentals.renter_id -->
  <path class="relation" d="M 286 228 C 430 228, 455 472, 585 472"/>
  <text class="relation-label" x="358" y="337">1 : N  rents</text>

  <!-- listed_items.id -> rentals.item_id -->
  <path class="relation" d="M 770 188 C 835 188, 835 432, 900 432"/>
  <text class="relation-label" x="846" y="303">1 : N  records</text>

  <!-- users.id -> application_logs.user_id -->
  <path class="relation" d="M 286 268 C 500 268, 545 700, 650 700"/>
  <text class="relation-label" x="383" y="572">0..1 : N  associates</text>

  <!-- users -->
  <g transform="translate(70 120)" filter="url(#shadow)">
    <rect class="entity" x="0" y="0" width="216" height="184" rx="10"/>
    <path class="header" d="M 0 34 V 10 A 10 10 0 0 1 10 0 H 206 A 10 10 0 0 1 216 10 V 34 Z"/>
    <line x1="0" y1="34" x2="216" y2="34" stroke="#394757"/>
    <text class="table-name" x="14" y="22">users</text>
    <text class="marker-pk" x="12" y="55">PK</text><text class="field" x="42" y="55">id</text><text class="type" x="202" y="55" text-anchor="end">INTEGER</text>
    <rect class="row-alt" x="1" y="65" width="214" height="27"/>
    <text class="field" x="42" y="83">username</text><text class="type" x="202" y="83" text-anchor="end">TEXT</text>
    <rect class="row-alt" x="1" y="119" width="214" height="27"/>
    <text class="field" x="42" y="137">password</text><text class="type" x="202" y="137" text-anchor="end">TEXT</text>
    <text class="field" x="42" y="173">created_at</text><text class="type" x="202" y="173" text-anchor="end">TEXT</text>
    <text class="constraint" x="42" y="101">UNIQUE · NOCASE · NOT NULL</text>
    <text class="constraint" x="42" y="155">NOT NULL · bcrypt hash</text>
  </g>

  <!-- listed_items -->
  <g transform="translate(520 90)" filter="url(#shadow)">
    <rect class="entity" x="0" y="0" width="250" height="246" rx="10"/>
    <path class="header" d="M 0 34 V 10 A 10 10 0 0 1 10 0 H 240 A 10 10 0 0 1 250 10 V 34 Z"/>
    <line x1="0" y1="34" x2="250" y2="34" stroke="#394757"/>
    <text class="table-name" x="14" y="22">listed_items</text>
    <text class="marker-pk" x="12" y="55">PK</text><text class="field" x="42" y="55">id</text><text class="type" x="236" y="55" text-anchor="end">INTEGER</text>
    <rect class="row-alt" x="1" y="65" width="248" height="27"/>
    <text class="marker-fk" x="12" y="83">FK</text><text class="field" x="42" y="83">owner_id</text><text class="type" x="236" y="83" text-anchor="end">INTEGER</text>
    <text class="constraint" x="42" y="101">NOT NULL · → users.id</text>
    <text class="field" x="42" y="128">name</text><text class="type" x="236" y="128" text-anchor="end">TEXT</text>
    <rect class="row-alt" x="1" y="140" width="248" height="27"/>
    <text class="field" x="42" y="158">description</text><text class="type" x="236" y="158" text-anchor="end">TEXT</text>
    <text class="field" x="42" y="185">cost_per_day</text><text class="type" x="236" y="185" text-anchor="end">TEXT</text>
    <text class="constraint" x="42" y="202">NOT NULL · positive numeric CHECK</text>
    <rect class="row-alt" x="1" y="210" width="248" height="27"/>
    <text class="field" x="42" y="228">status</text><text class="type" x="236" y="228" text-anchor="end">TEXT</text>
  </g>

  <!-- rentals -->
  <g transform="translate(585 420)" filter="url(#shadow)">
    <rect class="entity" x="0" y="0" width="250" height="246" rx="10"/>
    <path class="header" d="M 0 34 V 10 A 10 10 0 0 1 10 0 H 240 A 10 10 0 0 1 250 10 V 34 Z"/>
    <line x1="0" y1="34" x2="250" y2="34" stroke="#394757"/>
    <text class="table-name" x="14" y="22">rentals</text>
    <text class="marker-pk" x="12" y="55">PK</text><text class="field" x="42" y="55">id</text><text class="type" x="236" y="55" text-anchor="end">INTEGER</text>
    <rect class="row-alt" x="1" y="65" width="248" height="27"/>
    <text class="marker-fk" x="12" y="83">FK</text><text class="field" x="42" y="83">item_id</text><text class="type" x="236" y="83" text-anchor="end">INTEGER</text>
    <text class="constraint" x="42" y="101">NOT NULL · → listed_items.id</text>
    <rect class="row-alt" x="1" y="113" width="248" height="27"/>
    <text class="marker-fk" x="12" y="131">FK</text><text class="field" x="42" y="131">renter_id</text><text class="type" x="236" y="131" text-anchor="end">INTEGER</text>
    <text class="constraint" x="42" y="149">NOT NULL · → users.id</text>
    <text class="field" x="42" y="176">start_time</text><text class="type" x="236" y="176" text-anchor="end">TEXT</text>
    <text class="field" x="42" y="198">end_time</text><text class="type" x="236" y="198" text-anchor="end">TEXT</text>
    <text class="field" x="42" y="220">returned_at</text><text class="type" x="236" y="220" text-anchor="end">TEXT</text>
    <text class="field" x="42" y="242">status</text><text class="type" x="236" y="242" text-anchor="end">TEXT</text>
  </g>

  <!-- application_logs -->
  <g transform="translate(650 680)" filter="url(#shadow)">
    <rect class="entity" x="0" y="0" width="306" height="118" rx="10"/>
    <path class="header" d="M 0 34 V 10 A 10 10 0 0 1 10 0 H 296 A 10 10 0 0 1 306 10 V 34 Z"/>
    <line x1="0" y1="34" x2="306" y2="34" stroke="#394757"/>
    <text class="table-name" x="14" y="22">application_logs</text>
    <text class="marker-pk" x="12" y="55">PK</text><text class="field" x="42" y="55">id</text><text class="type" x="292" y="55" text-anchor="end">INTEGER</text>
    <rect class="row-alt" x="1" y="65" width="304" height="27"/>
    <text class="field" x="42" y="83">occurred_at · level · event_name</text><text class="type" x="292" y="83" text-anchor="end">TEXT</text>
    <text class="field" x="42" y="105">context_json</text><text class="type" x="292" y="105" text-anchor="end">TEXT · JSON CHECK</text>
    <text class="marker-fk" x="178" y="105">FK</text><text class="field" x="210" y="105">user_id</text>
  </g>

  <!-- Legend and schema-level notes -->
  <g transform="translate(1010 90)">
    <text class="legend-title" x="0" y="0">Legend</text>
    <text class="marker-pk" x="0" y="28">PK</text><text class="legend" x="30" y="28">Primary key</text>
    <text class="marker-fk" x="0" y="52">FK</text><text class="legend" x="30" y="52">Foreign key</text>
    <text class="marker-null" x="0" y="76">○</text><text class="legend" x="30" y="76">Nullable relationship</text>
    <text class="legend" x="0" y="116">Schema notes</text>
    <text class="legend" x="0" y="138">• One active rental per item</text>
    <text class="legend" x="0" y="158">• Rental end_time &gt; start_time</text>
    <text class="legend" x="0" y="178">• No self-rental trigger</text>
    <text class="legend" x="0" y="198">• Logs use ON DELETE SET NULL</text>
    <text class="legend" x="0" y="218">• Other FKs use ON DELETE RESTRICT</text>
  </g>
</svg>
